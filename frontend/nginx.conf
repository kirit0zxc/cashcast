# Единый вход: статика фронтенда + проксирование /api на FastAPI.
# Наружу публикуется только этот сервис; api, worker и postgres закрыты.
upstream cashcast_api {
    zone cashcast_api 64k;
    # Dockerменяет адрес при пересоздании API. nginx1.28 обновляет DNS без рестартаweb.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ограничение размера загружаемой выписки (должно совпадать с CC_MAX_UPLOAD_BYTES).
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://cashcast_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
