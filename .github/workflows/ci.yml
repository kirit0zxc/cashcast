name: CI

on:
  push:
    branches: [main, integration/night]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: cashcast
          POSTGRES_PASSWORD: cashcast
          POSTGRES_DB: cashcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashcast"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CC_DATABASE_URL: postgresql+psycopg://cashcast:cashcast@localhost:5432/cashcast
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.5"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps (frozen)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check migrations match models
        # autogenerate не должен находить изменений: модели и миграции согласованы.
        run: uv run alembic check
      - name: Tests (pytest + Postgres)
        run: uv run pytest -q
      - name: OpenAPI is up to date
        run: |
          uv run python -m app.scripts.export_openapi
          git diff --exit-code ../specs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
